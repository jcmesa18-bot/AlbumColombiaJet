<html lang="es">
<head>
<meta charset="utf-8">
<title>Álbum Jet #ColombiaSorprendente</title>
<meta name="theme-color" content="#1F3FD6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#EEF2FB;--surface:#FFFFFF;--ink:#101828;--muted:#5B6578;--line:#B9C3DD;
  --own:#1F3FD6;--own-ink:#FFFFFF;--edge:#FFFFFF;--dup:#FFC93C;--dup-ink:#3A2A00;--accent:#1F3FD6;--ok:#12805C;
  --display:"Lilita One","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1424;--surface:#18203A;--ink:#EEF2FF;--muted:#9AA6C4;--line:#34406B;--own:#4A66F0;--accent:#8AA0FF;--edge:#EEF2FF;--ok:#4CD6A0;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0E1424;--surface:#18203A;--ink:#EEF2FF;--muted:#9AA6C4;--line:#34406B;--own:#4A66F0;--accent:#8AA0FF;--edge:#EEF2FF;--ok:#4CD6A0;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{font-synthesis:none;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
h1,h3{font-family:var(--display);margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--own);color:#fff}
.btn.danger{color:#C62828;border:1.5px solid currentColor;background:transparent}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.top h1{font-size:clamp(1.15rem,5.6vw,1.6rem);font-weight:400;letter-spacing:.01em;line-height:1.05}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:56px;width:auto;border-radius:8px;display:block;box-shadow:0 0 0 1.5px var(--line),0 2px 6px rgba(16,24,40,.25)}
.bar{height:12px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--own);transition:width .25s}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.92rem;color:var(--muted)}
.stats b{color:var(--ink);font-size:1.05rem}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;justify-content:space-between}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--own);color:#fff;font-weight:700}

.grp{--cx:var(--c);margin-top:14px;border:1.5px solid var(--line);border-left:5px solid var(--cx,var(--line));border-radius:16px;background:var(--surface);overflow:hidden}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .grp{--cx:var(--cl)}}
:root[data-theme="dark"] .grp{--cx:var(--cl)}
.gh{width:100%;border:0;background:transparent;text-align:left;padding:12px 16px;display:grid;grid-template-columns:52px 1fr auto;gap:6px 12px;align-items:center}
.th{grid-row:1/3;width:52px;height:52px;border-radius:12px;object-fit:cover;display:block;box-shadow:0 0 0 1.5px var(--line)}
.th.ph{display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:1.4rem}
.gn{font-family:var(--display);font-weight:800;font-size:1.1rem;line-height:1.2}
.gn::before{content:"▸";display:inline-block;width:1.1em;color:var(--cx,var(--accent));transition:transform .15s}
.gh[aria-expanded="true"] .gn::before{transform:rotate(90deg)}
.gc{font-weight:700;font-size:.95rem;color:var(--muted)}
.gc.done{color:var(--ok)}
.gb{grid-column:2/-1;height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.gb b{display:block;height:100%;background:var(--cx,var(--own))}
.gbody{padding:0 16px 16px}
.gbody h3{font-size:.95rem;font-weight:600;color:var(--muted);margin:16px 0 8px;display:flex;justify-content:space-between;gap:8px}
.gbody h3 small{font-family:var(--body);font-weight:700;font-size:.85rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:4/5;border-radius:10px;border:2px dashed var(--line);background:transparent;color:var(--muted);font-family:var(--display);font-weight:600;font-size:1.1rem;display:flex;align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tile.own{background:var(--c,var(--own));color:var(--own-ink);border:0;box-shadow:inset 0 0 0 3px var(--edge),0 1px 2px rgba(16,24,40,.25);font-weight:800}
.tile .dup{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--dup);color:var(--dup-ink);font-family:var(--body);font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.tile:active{transform:scale(.95)}
.empty{color:var(--muted);padding:28px 0;text-align:center}

.share{margin-top:28px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px}
.share summary{padding:14px 0;font-weight:700;cursor:pointer}
.share textarea{width:100%;min-height:170px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:10px;font:inherit;font-size:.92rem;resize:vertical;color:var(--ink)}
.share .acts{padding:10px 0 14px}
.foot{margin-top:24px;display:flex;justify-content:flex-end}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,32,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;border-top:6px solid var(--c,var(--own));padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .num{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1}
.sheet .sec{color:var(--muted);font-size:.95rem;margin-top:2px}
.sheet .sec b{color:var(--ink)}
.sheet img{display:block;width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:var(--bg);margin:14px 0}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  var EMO=["📅","","","","📍",""];
  function thumb(i){return IMG[i]?'<img class="th" alt="" src="'+IMG[i]+'">':'<span class="th ph" aria-hidden="true">'+EMO[i]+'</span>'}

  function load(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({counts:counts}))}catch(e){}}
  function toast(t){var el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove("on")},1600)}
  function cnt(n){return counts[n]||0}
  function ranges(a){
    if(!a.length)return "ninguna";
    var out=[],s=a[0],p=a[0];
    for(var i=1;i<=a.length;i++){var v=a[i];if(v===p+1){p=v;continue}out.push(s===p?String(s):s+"-"+p);s=v;p=v}
    return out.join(", ");
  }

  function render(){
    var owned=0,dups=0,miss=[],dl=[];
    for(var n=1;n<=MAX;n++){var c=cnt(n);if(c>0)owned++;else miss.push(n);if(c>1){dups+=c-1;dl.push(n)}}
    var pct=Math.round(owned/MAX*100);
    $("sOwned").textContent=owned;$("sTotal").textContent=MAX;$("sPct").textContent=pct;
    $("sMiss").textContent=MAX-owned;$("sDup").textContent=dups;
    $("barFill").style.width=pct+"%";$("barWrap").setAttribute("aria-valuenow",pct);

    var html="";
    G.forEach(function(g,gi){
      var go=0,gt=0,body="";
      g.items.forEach(function(it){
        var io=0,tiles="";
        for(var k=it.a;k<=it.b;k++){
          var cc=cnt(k);if(cc>0)io++;
          if(filter==="missing"&&cc>0)continue;
          if(filter==="dups"&&cc<2)continue;
          tiles+='<button class="tile'+(cc>0?" own":"")+'" data-n="'+k+'" aria-label="Figurita '+k+', '+cc+(cc===1?" copia":" copias")+'">'+k+(cc>1?'<span class="dup">+'+(cc-1)+'</span>':"")+'</button>';
        }
        go+=io;gt+=it.b-it.a+1;
        if(tiles)body+=(it.solo?"":'<h3><span>'+it.name+'</span><small>'+io+"/"+(it.b-it.a+1)+'</small></h3>')+'<div class="grid">'+tiles+'</div>';
      });
      var open=filter!=="all"||openSet[gi];
      if(filter!=="all"&&!body)return;
      html+='<section class="grp" style="--c:'+g.c+';--cl:'+g.cl+'"><button class="gh" data-g="'+gi+'" aria-expanded="'+(open?"true":"false")+'">'+thumb(gi)+'<span class="gn">'+g.name+'</span><span class="gc'+(go===gt?" done":"")+'">'+go+"/"+gt+(go===gt?" ✓":"")+'</span><i class="gb"><b style="width:'+Math.round(go/gt*100)+'%"></b></i></button>'+(open?'<div class="gbody">'+body+'</div>':"")+'</section>';
    });
    if(!html)html='<p class="empty">'+(filter==="missing"?"No te falta ninguna. Álbum completo.":"Aún no tienes repetidas.")+"</p>";
    $("groups").innerHTML=html;

    var dt=dl.map(function(n){return n+" (+"+(cnt(n)-1)+")"}).join(", ")||"ninguna";
    $("out").value="Me faltan ("+miss.length+"): "+ranges(miss)+"\n\nTengo repetidas ("+dups+"): "+dt;
  }

  function loadImg(n){
    var ext=["jpg","png","webp","jpeg"],i=0,box=$("imgBox");
    (function next(){
      if(i>=ext.length){box.innerHTML='<p class="sec" style="margin:14px 0">Aún no hay imagen guardada para esta figurita.</p>';return}
      var im=new Image();
      im.onload=function(){box.innerHTML="";im.alt="Figurita "+n;box.appendChild(im)};
      im.onerror=function(){i++;next()};
      im.src="img/"+n+"."+ext[i];
    })();
  }
  function openSheet(n){
    var g,it;
    G.forEach(function(gg){gg.items.forEach(function(ii){if(n>=ii.a&&n<=ii.b){g=gg;it=ii}})});
    var c=cnt(n),st=c===0?"Te falta":(c===1?"La tienes":"La tienes, "+(c-1)+(c===2?" repetida":" repetidas"));
    var where=g.name+(it.solo?"":" · "+it.name.replace("★ ",""));
    var q=encodeURIComponent("Chocolatina Jet Colombia Sorprendente lámina "+n);
    $("sheetBody").innerHTML='<div class="num">'+n+'</div><div class="sec">'+where+'</div><div class="sec"><b>'+st+'</b></div><div id="imgBox"></div><div class="row"><a class="btn" href="https://www.google.com/search?tbm=isch&amp;q='+q+'" target="_blank" rel="noopener">Buscar imagen en línea</a><button class="btn ghost" id="shClose">Cerrar</button></div>';
    $("sheet").style.setProperty("--c",g.c);
    $("sheetBg").classList.add("on");
    loadImg(n);
  }
  function closeSheet(){$("sheetBg").classList.remove("on")}
  $("sheetBg").addEventListener("click",function(e){if(e.target===$("sheetBg")||e.target.id==="shClose")closeSheet()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
  $("groups").addEventListener("click",function(e){
    var h=e.target.closest(".gh");
    if(h){var gi=+h.dataset.g;openSet[gi]=!openSet[gi];render();return}
    var t=e.target.closest(".tile");if(!t)return;
    var n=+t.dataset.n,c=cnt(n);
    if(mode==="view"){openSheet(n);return}
    c=mode==="add"?c+1:Math.max(0,c-1);
    if(c===0)delete counts[n];else counts[n]=c;
    save();render();
  });
  [["mAdd","add"],["mSub","sub"],["mView","view"]].forEach(function(p){
    $(p[0]).onclick=function(){mode=p[1];[["mAdd","add"],["mSub","sub"],["mView","view"]].forEach(function(q){$(q[0]).setAttribute("aria-pressed",q[1]===mode?"true":"false")})};
  });
  document.querySelectorAll("[data-f]").forEach(function(b){
    b.onclick=function(){
      filter=b.dataset.f;
      document.querySelectorAll("[data-f]").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
      render();
    };
  });
  $("copyBtn").onclick=function(){
    var txt=$("out").value;
    function fb(){$("out").select();try{document.execCommand("copy")}catch(e){}toast("Lista copiada")}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast("Lista copiada")},fb)}else fb();
  };
  $("bkMake").onclick=function(){var t=JSON.stringify({v:2,counts:counts}),el=$("bk");el.value=t;function fb(){el.select();try{document.execCommand("copy")}catch(e){}toast("Copia generada")}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Copia copiada")},fb)}else fb()};
  $("bkRestore").onclick=function(){try{var o=JSON.parse($("bk").value);if(!o||typeof o.counts!=="object")throw 0;var c={};for(var k in o.counts){var n=+k,v=+o.counts[k];if(n>=1&&n<=MAX&&v>0)c[n]=Math.min(v,99)}counts=c;save();render();toast("Avance restaurado")}catch(e){toast("El texto no es una copia válida")}};
  var armed=false;
  $("resetBtn").onclick=function(){
    var b=$("resetBtn");
    if(!armed){armed=true;b.textContent="Toca otra vez para borrar";setTimeout(function(){armed=false;b.textContent="Borrar todo el avance"},4000);return}
    counts={};save();armed=false;b.textContent="Borrar todo el avance";render();toast("Avance borrado");
  };

  var s=load(KEY)||load("figuritas-v1");
  if(s&&s.counts){for(var k in s.counts){if(+k>=1&&+k<=MAX)counts[k]=s.counts[k]}}
  render();
})();
